<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Prebid VideoJS – преролл + каждые 30 с</title>

    <script async src="https://securepubads.g.doubleclick.net/tag/js/gpt.js" crossorigin="anonymous"></script>

    <!-- Prebid build -->
    <script async
        src="https://cdn.jsdelivr.net/gh/iammacheta/prebidjs-video-code@aeabe6d09ed170762d0e0293c597168e4945bf51/prebid.js"></script>

    <!-- VideoJS + IMA -->
    <link href="https://vjs.zencdn.net/7.20.2/video-js.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/videojs-contrib-ads/6.9.0/videojs-contrib-ads.css"
        rel="stylesheet">
    <script src="https://vjs.zencdn.net/7.20.2/video.min.js"></script>
    <script src="https://imasdk.googleapis.com/js/sdkloader/ima3.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-contrib-ads/6.9.0/videojs-contrib-ads.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-ima/1.11.0/videojs.ima.js"></script>

    <style>
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* ▸ контейнер для плеера (точно 400 × 225) */
        .example-video-container {
            width: 400px;
            height: 225px;
        }

        /* ▸ сам плеер растягиваем на весь контейнер */
        .example-video-container .video-js,
        .example-video-container video {
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <div id="div-gpt-ad-prebid-video-0"></div>
    <div class="example-video-container">
        <!-- width / height для надёжности + CSS-резерв -->
        <video-js id="player" class="vjs-big-play-centered" width="400" height="225" autoplay muted
            playsinline></video-js>
    </div>

    <script>

        window.googlefc = window.googlefc || {};
        googlefc.callbackQueue = googlefc.callbackQueue || [];

        googlefc.callbackQueue.push({
            'CONSENT_DATA_READY': () => {
                // safe to run Prebid and GPT now

            }
        });

        /*****************************************************************
         * 1 — adUnit (можно добавить других bidders)
         *****************************************************************/
        const adUnits = [{
            code: 'div-gpt-ad-prebid-video-0',
            mediaTypes: {
                video: {
                    context: 'instream', // Recommended. legacy placement attribute .  Технический способ вызова плеера
                    plcmt: 2, // Highly recommended to comply with new IAB video specifications. Accompanying Content по OpenRTB 2.6 https://iabtechlab.com/demystifying-openrtb-video-plcmt-attributes/
                    playerSize: [400, 225], // Optional. The size (width, height) of the video player on the page, in pixels.
                    mimes: ['video/mp4'], // ? recommended or required. Content MIME types supported, e.g., "video/x-ms-wmv", "video/mp4". Required by OpenRTB when using Prebid Server.
                    startdelay: 0, // recommended. Indicates the start delay in seconds for ad placements
                    maxduration: 30, // recommended. Maximum video ad duration in seconds.
                    protocols: [2, 3, 5, 6, 7, 8],// recommended - iab, optional - prebid.  Describe the VAST formats your ad-renderer can play,  the renderer is Google IMA HTML5 SDK, because the videojs-ima plugin
                    linearity: 1, // Optional. Indicates if the impression must be linear
                    placement: 3, // Recommended. To support nonupdated ssps. 3=in-article
                    playbackmethod: [6] // Initiates on Entering Viewport with Sound Off by Default
                }
            },
            video: { divId: 'player' },
            bids: [
                { bidder: 'appnexus', params: { placementId: 36028569 } },
                { bidder: 'adagio', params: { organizationId: '1458', site: 'mobalytics-gg' } },
                { bidder: 'oms', params: { publisherId: '21048' } },
                { bidder: 'onetag', params: { pubId: '80ac484cd63fd7e', ext: { placement_name: 'web-video' } } },
                { bidder: 'unruly', params: { siteId: 287980 } },
                { bidder: 'vidazoo', params: { cId: '67ee7a23e3011c328b218c68', pId: '59ac17c192832d0011283fe3', subDomain: 'exchange' } },
                {
                    bidder: 'openx',
                    params: {
                        unit: '562882193',
                        delDomain: 'mobalytics-d.openx.net'
                    }
                },
                {
                    bidder: 'pubmatic',
                    params: {
                        publisherId: '165261',
                        adSlot: '6135387'
                    }
                },
                {
                    bidder: 'sovrn',
                    params: {
                        tagid: '1282326'
                    }
                },
                {
                    bidder: 'gumgum',
                    params: {
                        zone: 'og42aben',
                        slot: '1315516'
                    }
                },
                {
                    bidder: 'rubicon',
                    params: {
                        accountId: 7780,
                        siteId: 87184,
                        zoneId: 412394,
                        video: {
                            language: 'en'
                        }
                    }
                },
                {
                    bidder: "iionads",
                    params: {
                        host: "ads-247co.iionads.com",
                        adUnitId: 42236,
                        adUnitType: "Video",
                        publisherId: "2235800"
                    }
                },
                {
                    bidder: 'medianet',
                    params: {
                        cid: '8CUC2405Y',
                        crid: '688008280',
                    }
                }
            ]
        }];

        /*****************************************************************
         * 2 — Prebid setup
         *****************************************************************/
        const pbjs = window.pbjs = window.pbjs || {};
        pbjs.que = pbjs.que || [];

        pbjs.que.push(function () {
            pbjs.setConfig({
                video: { // view-source:https://docs.prebid.org/prebid-video/video-module/integration-examples/videojs.html
                    providers: [{
                        divId: 'player', // required. The HTML element id of the player or its placeholder div. Additionally, used to indicate which HTLM element must contain the Video Player instance when instantiated.
                        vendorCode: 2, // required. The identifier of the Video Provider vendor. "2" for Video.js Video Provider
                        playerConfig: {
                            params: {
                                adPluginConfig: { adLabel: 'Prebid Video', numRedirects: 10 }, // Options for the videojs-ima plugin
                                vendorConfig: { controls: true, autoplay: true, preload: 'auto', muted:true } // Object passed straight to videojs() on instantiation
                            }
                        },
                        adServer: {
                            vendorCode: 'gam',
                            baseAdTagUrl: // The VAST tag template; Prebid appends hb_ key-values (price, bidder, cache ID)
                                'https://pubads.g.doubleclick.net/gampad/ads?' +
                                'iu=/21974715207/prebid_cache_video_adunit' +   // ваш ad-unit
                                '&sz=400x225' +                                // размер плеера
                                '&impl=s&gdfp_req=1' +                         // схема GAM
                                '&env=vp' +                                    // video-player
                                '&output=xml_vast4' +                          // формат ответа
                                '&unviewed_position_start=1'                   // отложенный показ
                        }

                    }]
                },
                cache: { url: 'https://prebid.adnxs.com/pbc/v1/cache' }, // Endpoint where Prebid stores the raw VAST returned by bidders; Keep the AppNexus-hosted cache unless you run your own.

            });

            /***************** ПЕРВЫЙ (preroll) аукцион *****************/
            pbjs.addAdUnits(adUnits);
            pbjs.requestBids(adUnits);

            // фиксируем момент первого запроса
            let lastBidRequestTs = Date.now();

            /***************** player ready → контент + mid‑roll цикл *****/
            pbjs.onEvent('videoSetupComplete', () => {
                const player = videojs('player');

                player.loadMedia({
                    src: 'https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
                    type: 'video/mp4',
                    id: 'bbb',
                    title: 'Big Buck Bunny'
                });

                /* --- управляющие флаги и функции -------------------- */
                let busyWithAdOrRequest = true; // true → на момент старта уже идёт запрос для преролла
                const BID_INTERVAL = 30_000;    // 30 000 мс = 30 с

                function maybeRequestBid() {
                    const now = Date.now();
                    if (!busyWithAdOrRequest && (now - lastBidRequestTs) >= BID_INTERVAL) {
                        console.log('⏰ 30 с истекли → запрашиваем свежий ролик');
                        busyWithAdOrRequest = true;  // блокируем повторные вызовы
                        lastBidRequestTs = now;      // фиксируем момент запроса
                        pbjs.requestBids(adUnits);
                    }
                }

                /* ---------- События плеера и Prebid ------------------ */
                player.on('adstart', () => {
                    busyWithAdOrRequest = true; // реклама пошла → считаем слот занятым
                });

                player.on('adend', () => {
                    busyWithAdOrRequest = false; // освободились, ждём 30 с до следующего запроса
                });

                pbjs.onEvent('videoBidError', () => {
                    console.warn('⚠️ videoBidError: ставка не получена');
                    busyWithAdOrRequest = false; // разблокируем, но интервал в 30 с сохраняется
                });

                /* Каждое обновление позиции контента — проверяем таймер */
                player.on('timeupdate', maybeRequestBid);
            });
        });
    </script>
</body>

</html>
